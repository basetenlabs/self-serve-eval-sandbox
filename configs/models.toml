# Models `pr-eval run --models` can name, and what each costs.
#
# Prices are USD per million tokens. Attempts in Pi are priced from this table, call by call.
# Under Claude Code (runs started with --harness claude-code), which prices every model at
# Anthropic list rates, open models are priced from this table and Claude models take Claude
# Code's own figure, which knows the 1-hour cache writes its usage report doesn't break out.
# Check the numbers before quoting a cost:
#   OpenAI     https://developers.openai.com/api/docs/pricing (Standard, 30-minute cache)
#   Anthropic  https://www.anthropic.com/pricing (API list rates)
#   Baseten    https://www.baseten.co/pricing/ (Model APIs)
#
# Each model speaks its provider's own API from Pi, through the model relay in the trial's
# sandbox, which adds the key; `effort` is Pi's thinking level, sent as each API expects it.
# provider = "anthropic": the Anthropic Messages API, authenticated by ANTHROPIC_API_KEY or
#   CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
# provider = "openai": the OpenAI Responses API, with OPENAI_API_KEY.
# provider = "baseten": Baseten Model APIs' Chat Completions endpoint, with BASETEN_API_KEY.
# Under Claude Code the relay translates the Anthropic API for OpenAI and Baseten models, and
#   sets the same `effort` on every Baseten request.
# pi (optional) tells Pi about a model its catalog doesn't list yet: its context window and
#   longest answer, in tokens.
# max_concurrent (optional) caps how many attempts of one model run at once, for a
#   provider that rate-limits the key. Time spent in retry backoff is excluded from the
#   report's wall clock either way.
# estimate_from (optional) lists models whose past runs estimate a new model's cost and
#   time per attempt until it has runs of its own.
# maker names who makes a closed model. The report says who serves each model it compares:
#   "Baseten's GLM-5.3" for an open model, "Anthropic's Claude Opus 5.5" for a closed one.
# The Fast variants (GLM-5.3 Fast, DeepSeek V4.1 Flash 1017 Fast) and Kimi K3 are no longer offered:
#   pipeline.RETIRED names what replaced each. Past runs keep their own models in run.json.

[defaults]
effort = "high"

[models.claude-opus]
label = "Claude Opus 5.5"
kind = "closed"
provider = "anthropic"
maker = "Anthropic"
model = "claude-opus-5-5"

[models."gpt-6.2-sol"]
label = "GPT-6.2 Sol"
kind = "closed"
maker = "OpenAI"
provider = "openai"
model = "gpt-6.2-sol"
prices."gpt-6.2-sol" = { input = 2.00, cached_input = 0.10, cache_write = 2.50, output = 10.00 }
estimate_from = ["claude-opus"]

[models."gpt-6.2-astra"]
label = "GPT-6.2 Astra"
kind = "closed"
maker = "OpenAI"
provider = "openai"
model = "gpt-6.2-astra"
prices."gpt-6.2-astra" = { input = 8.00, cached_input = 0.40, cache_write = 10.00, output = 40.00 }
estimate_from = ["gpt-6.2-sol", "claude-opus"]

[models."gpt-6-luna"]
label = "GPT-6 Luna"
kind = "closed"
maker = "OpenAI"
provider = "openai"
model = "gpt-6-luna"
prices."gpt-6-luna" = { input = 0.10, cached_input = 0.01, cache_write = 0.125, output = 0.50 }
estimate_from = ["gpt-6.2-sol", "claude-opus"]

[models.claude-sonnet]
label = "Claude Sonnet 5.5"
kind = "closed"
maker = "Anthropic"
provider = "anthropic"
model = "claude-sonnet-5-5"
estimate_from = ["claude-opus"]

[models.claude-haiku]
label = "Claude Haiku 5.5"
kind = "closed"
maker = "Anthropic"
provider = "anthropic"
model = "claude-haiku-5-5"
estimate_from = ["claude-sonnet", "claude-opus"]

[provider_prices.anthropic]
# Claude Code sends some background requests to its small model; price them too.
# cache_write is the 5-minute cache; Claude Code mostly writes the 1-hour one, which
# costs twice the input rate (cache_write_1h).
"claude-opus-5-5" = { input = 4.00, cache_write = 5.00, cache_write_1h = 8.00, cached_input = 0.20, output = 20.00 }
"claude-haiku-4-5" = { input = 1.00, cache_write = 1.25, cache_write_1h = 2.00, cached_input = 0.10, output = 5.00 }
"claude-haiku-5-5" = { input = 0.10, cache_write = 0.125, cache_write_1h = 0.20, cached_input = 0.01, output = 0.50 }
"claude-sonnet-5-5" = { input = 2.00, cache_write = 2.50, cache_write_1h = 4.00, cached_input = 0.20, output = 10.00 }

[models."glm-5.3"]
label = "GLM-5.3"
kind = "open"
provider = "baseten"
model = "zai-org/GLM-5.3"
prices."zai-org/GLM-5.3" = { input = 1.40, cached_input = 0.14, output = 4.40 }

[models."kimi-k3.1-pro"]
label = "Kimi K3.1 Pro"
kind = "open"
provider = "baseten"
model = "moonshotai/Kimi-K3.1-Pro"
# Baseten list rates (baseten.co/pricing, 2026-11-04).
prices."moonshotai/Kimi-K3.1-Pro" = { input = 2.00, cached_input = 0.20, output = 10.00 }
estimate_from = ["glm-5.3"]

[models.muse-spark]
label = "Muse Spark Open"
kind = "open"
provider = "baseten"
model = "meta-models/muse-spark-open"
pi = { context_window = 1048576, max_tokens = 262144 }
# Stays within the key's rate limit.
max_concurrent = 2
prices."meta-models/muse-spark-open" = { input = 1.25, cached_input = 0.15, output = 4.25 }
estimate_from = ["glm-5.3"]

[models."deepseek-v4.1-flash"]
# The 1017 release, which Baseten serves beside an undated DeepSeek-V4.1-Flash: the label says which.
label = "DeepSeek V4.1 Flash 1017"
kind = "open"
provider = "baseten"
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017"
prices."deepseek-ai/DeepSeek-V4.1-Flash-1017" = { input = 0.30, cached_input = 0.007, output = 1.20 }

[models."nemotron-3.5-super"]
label = "Nemotron 3.5 Super"
kind = "open"
provider = "baseten"
model = "nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B"
pi = { context_window = 1048576, max_tokens = 262144 }
prices."nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B" = { input = 0.20, cached_input = 0.04, output = 0.50 }
estimate_from = ["deepseek-v4.1-flash", "glm-5.3"]

# The judges grade every attempt the hidden tests have run on. Each reads the request,
# the merged diff and the agent's diff on its own; then the chair reads the same evidence
# and their verdicts and gives the final one, which decides whether the attempt is solved.
# Judge tokens are reported separately: they are the cost of grading, not of the work. A
# Chat Completions judge needs `prices` (USD per million tokens) for the hosted spending
# limits to count it; Claude Code prices the Claude judge itself.
#
# provider = "anthropic" runs a Claude model through Claude Code (print mode, no tools)
#   with the same credential as the Claude models above. Any other judge calls an
#   OpenAI-compatible Chat Completions endpoint, authenticated by the variable `api_key_env`
#   names. `effort` is sent as reasoning_effort, or as Claude Code's --effort.
[judge]
effort = "high"
chair = "moonshotai/Kimi-K3.1-Pro"

[[judge.panel]]
label = "Claude Opus 5.5"
provider = "anthropic"
model = "claude-opus-5-5"

[[judge.panel]]
label = "GPT-6.1 Sol"
model = "gpt-6.1-sol"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# OpenAI's list rates (developers.openai.com/api/docs/pricing, 2026-10-17); prompts here stay
# far under the 272K tokens past which it charges more.
prices = { input = 2.00, cached_input = 0.10, output = 10.00 }

[[judge.panel]]
label = "Kimi K3.1 Pro"
model = "moonshotai/Kimi-K3.1-Pro"
base_url = "https://inference.baseten.co/v1"
api_key_env = "BASETEN_API_KEY"
prices = { input = 2.00, cached_input = 0.20, output = 10.00 }
# It also chairs, so it grades twice per attempt; the cap keeps it within the key's rate limit.
max_concurrent = 4
